<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the layout extend into iPhone notch/safe areas;
         we use env(safe-area-inset-*) in styles.css to pad the chrome away
         from the notch and home indicator. maximum-scale lets users pinch-zoom. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2A302B" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <!-- App typeface: Hanken Grotesk (UI) + JetBrains Mono (numbers /
         money / document ids). preconnect shaves the font fetch latency. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Stayvia</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
